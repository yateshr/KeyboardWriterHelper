name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  personal-learning:
    name: Personal Learning (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run portable personal learning regressions
        run: dotnet run --project tests/Personalization/Personalization.csproj -c Release

  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build with .NET 10
        run: dotnet build -c Release

      - name: Run personal learning regressions on Windows
        run: dotnet run --project tests/Personalization/Personalization.csproj -c Release

      - name: Build with .NET Framework 4.0 (csc.exe)
        shell: cmd
        run: build.cmd

      - name: Verify Version Output
        shell: pwsh
        run: .\KeyboardWriterHelper.exe --version | Out-Host

      - name: Run Full Test Suite
        shell: cmd
        run: test.cmd

      - name: Publish .NET 10 Standalone Single-File
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist/net10-x64

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item KeyboardWriterHelper.exe -Destination artifacts/KeyboardWriterHelper-net40.exe
          Copy-Item dist/net10-x64/KeyboardWriterHelper.exe -Destination artifacts/KeyboardWriterHelper-net10-x64.exe

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardWriterHelper-binaries
          path: artifacts/
